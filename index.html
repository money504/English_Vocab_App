<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>無壓力單字特訓</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0fdf4;
            -webkit-tap-highlight-color: transparent;
        }
        .hide { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .soft-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 歡迎畫面 -->
    <div id="welcome-screen" class="bg-white rounded-3xl soft-shadow p-8 max-w-sm w-full text-center fade-in">
        <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-headphones-alt text-4xl text-green-500"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-800 mb-2">每日輕鬆聽讀</h1>
        <p class="text-gray-500 mb-8 text-sm leading-relaxed">沒有測驗、沒有打分。<br>聽完發音後，請試著自己大聲唸出來！</p>
        <button onclick="startLearning()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-2xl shadow-lg transition-transform active:scale-95 text-lg">
            <i class="fas fa-play mr-2"></i> 開始今天的 5 個字
        </button>
    </div>

    <!-- 學習畫面 -->
    <div id="learning-screen" class="hide bg-white rounded-3xl soft-shadow p-6 max-w-sm w-full flex flex-col h-[80vh] max-h-[600px] fade-in relative">
        <div class="flex justify-between items-center mb-4 text-gray-400">
            <span id="progress-text" class="font-bold text-sm bg-gray-100 px-3 py-1 rounded-full">1 / 5</span>
            <button onclick="endLearning()" class="p-2 text-gray-400 hover:text-red-400 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <div class="w-full bg-gray-100 rounded-full h-1.5 mb-6">
            <div id="progress-bar" class="bg-green-400 h-1.5 rounded-full transition-all duration-500" style="width: 20%"></div>
        </div>

        <div class="flex-grow flex flex-col justify-center items-center text-center">
            <h2 id="word-title" class="text-5xl font-extrabold text-gray-800 mb-3 tracking-tight">word</h2>
            
            <div class="flex items-center gap-3 mb-6">
                <span id="word-pos" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-xl text-sm font-bold">n.</span>
                <!-- 重新播放發音按鈕 -->
                <button onclick="speakCurrentWord()" class="text-blue-500 hover:text-blue-600 bg-blue-50 px-4 py-2 rounded-full flex items-center justify-center transition-colors active:scale-95 font-bold text-sm">
                    <i class="fas fa-volume-up mr-2"></i> 再聽一次
                </button>
            </div>
            
            <div class="w-full bg-slate-50 p-5 rounded-2xl border border-slate-100 mb-6">
                <p id="word-zh" class="text-2xl text-gray-800 font-bold mb-3">中文意思</p>
                <div class="text-left border-t border-gray-200 pt-3">
                    <p id="word-en-eg" class="text-gray-600 text-md font-medium mb-1">Example sentence.</p>
                    <p id="word-zh-eg" class="text-gray-400 text-sm">例句中文翻譯</p>
                </div>
            </div>

            <!-- 跟讀小提示 -->
            <div class="w-full bg-green-50 rounded-xl p-3 border border-green-100 flex items-center justify-center gap-2">
                <i class="fas fa-bullhorn text-green-500"></i>
                <p class="text-sm text-green-700 font-bold">換你大聲唸唸看！</p>
            </div>
        </div>

        <div class="flex gap-3 mt-4">
            <button onclick="prevWord()" id="prev-btn" class="w-14 bg-gray-50 text-gray-400 font-bold py-4 rounded-2xl transition-colors active:bg-gray-100 disabled:opacity-30">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button onclick="nextWord()" id="next-btn" class="flex-grow bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-2xl shadow-lg transition-transform active:scale-95 text-lg">
                唸好了，下一個 <i class="fas fa-arrow-right ml-1"></i>
            </button>
        </div>
    </div>

    <!-- 完成畫面 -->
    <div id="finish-screen" class="hide bg-white rounded-3xl soft-shadow p-8 max-w-sm w-full text-center fade-in">
        <div class="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-award text-4xl text-yellow-500"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-gray-800 mb-2">太棒了！</h2>
        <p class="text-gray-500 mb-8 text-sm">你今天又完成了 5 個單字。<br>持續累積，你的英文一定會突飛猛進！</p>
        <button onclick="location.reload()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-2xl shadow-lg transition-transform active:scale-95 text-lg">
            <i class="fas fa-redo mr-2"></i> 再練 5 個字
        </button>
    </div>

    <!-- ★ 重點在這裡：我們把單字庫檔案載入進來 ★ -->
    <script src="words_A.js"></script>

    <script>
        let dailyWords = [];
        let currentIndex = 0;
        const synth = window.speechSynthesis;

        function getRandomWords(db, count) {
            const shuffled = [...db].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        
       function startLearning() {

    // 確認單字庫有成功載入
    if (!window.wordDatabase) {
        alert("單字庫沒有載入成功！");
        return;
    }

    dailyWords = getRandomWords(window.wordDatabase, 5);
    currentIndex = 0;

    document.getElementById('welcome-screen').classList.add('hide');
    document.getElementById('learning-screen').classList.remove('hide');

    updateCard();
}

        function updateCard() {
            const current = dailyWords[currentIndex];
            document.getElementById('word-title').textContent = current.word;
            document.getElementById('word-pos').textContent = current.pos;
            document.getElementById('word-zh').textContent = current.zh;
            document.getElementById('word-en-eg').textContent = current.en_eg;
            document.getElementById('word-zh-eg').textContent = current.zh_eg;
            
            document.getElementById('progress-text').textContent = `${currentIndex + 1} / ${dailyWords.length}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / dailyWords.length) * 100}%`;
            
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            
            const nextBtn = document.getElementById('next-btn');
            if (currentIndex === dailyWords.length - 1) {
                nextBtn.innerHTML = '完成今日任務 <i class="fas fa-check-circle ml-1"></i>';
                nextBtn.classList.replace('bg-gray-800', 'bg-green-500');
                nextBtn.classList.replace('hover:bg-gray-900', 'hover:bg-green-600');
            } else {
                nextBtn.innerHTML = '唸好了，下一個 <i class="fas fa-arrow-right ml-1"></i>';
                nextBtn.classList.replace('bg-green-500', 'bg-gray-800');
                nextBtn.classList.replace('hover:bg-green-600', 'hover:bg-gray-900');
            }

            speakCurrentWord();
        }

        function speakCurrentWord() {
            if (synth.speaking) synth.cancel();
            
            const current = dailyWords[currentIndex];
            
            const utterWord = new SpeechSynthesisUtterance(current.word);
            utterWord.lang = 'en-US';
            utterWord.rate = 0.45; 
            
            const utterSentence = new SpeechSynthesisUtterance(current.en_eg);
            utterSentence.lang = 'en-US';
            utterSentence.rate = 0.5;

            synth.speak(utterWord);
            
            utterWord.onend = () => {
                setTimeout(() => { synth.speak(utterSentence); }, 800);
            };
        }

        function nextWord() {
            if (currentIndex < dailyWords.length - 1) { currentIndex++; updateCard(); } 
            else { 
                synth.cancel();
                document.getElementById('learning-screen').classList.add('hide'); 
                document.getElementById('finish-screen').classList.remove('hide'); 
            }
        }
        function prevWord() { if (currentIndex > 0) { currentIndex--; updateCard(); } }
        function endLearning() { synth.cancel(); location.reload(); }
    </script>
</body>
</html>
