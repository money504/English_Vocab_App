<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無壓力單字特訓</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0fdf4;
            -webkit-tap-highlight-color: transparent;
        }

        .hide {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .soft-shadow {
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 歡迎畫面 -->
    <div id="welcome-screen"
         class="bg-white rounded-3xl soft-shadow p-8 max-w-sm w-full text-center fade-in">

        <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-headphones-alt text-4xl text-green-500"></i>
        </div>

        <h1 class="text-2xl font-extrabold text-gray-800 mb-2">
            每日輕鬆聽讀
        </h1>

        <p class="text-gray-500 mb-4 text-sm leading-relaxed">
            沒有測驗、沒有打分。<br>
            聽完發音後，請試著自己大聲唸出來！
        </p>

        <div class="mb-6">
            <label for="book-select"
                   class="block text-gray-700 font-bold mb-2">
                選擇教材
            </label>

            <select id="book-select"
                    class="w-full border rounded-xl p-3 text-center font-bold">
                <option value="8A">八年級上學期 (8A)</option>
            </select>
        </div>

        <button type="button"
                onclick="startLearning()"
                class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-2xl shadow-lg transition-transform active:scale-95 text-lg">
            <i class="fas fa-play mr-2"></i>
            開始今天的 5 個字
        </button>

        <p id="round-info"
           class="mt-4 text-xs text-gray-400"></p>

        <div class="grid grid-cols-2 gap-3 mt-5">
            <button type="button"
                    onclick="openRecords()"
                    class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-3 rounded-2xl transition-colors active:scale-95">
                <i class="fas fa-chart-line mr-2"></i>
                學習紀錄
            </button>

            <button type="button"
                    onclick="openSearch()"
                    class="bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold py-3 rounded-2xl transition-colors active:scale-95">
                <i class="fas fa-search mr-2"></i>
                搜尋單字
            </button>
        </div>
    </div>

    <!-- 學習紀錄畫面 -->
    <div id="records-screen"
         class="hide bg-white rounded-3xl soft-shadow p-6 max-w-sm w-full fade-in">

        <div class="flex items-center justify-between mb-5">
            <h2 class="text-2xl font-extrabold text-gray-800">
                學習紀錄
            </h2>

            <button type="button"
                    onclick="showWelcome()"
                    aria-label="返回首頁"
                    class="p-2 text-gray-400 hover:text-gray-700">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-green-50 rounded-2xl p-4 text-center">
                <p id="record-sessions" class="text-3xl font-extrabold text-green-600">0</p>
                <p class="text-xs text-green-700 mt-1">完成次數</p>
            </div>

            <div class="bg-blue-50 rounded-2xl p-4 text-center">
                <p id="record-words" class="text-3xl font-extrabold text-blue-600">0</p>
                <p class="text-xs text-blue-700 mt-1">完成單字數</p>
            </div>

            <div class="bg-amber-50 rounded-2xl p-4 text-center">
                <p id="record-days" class="text-3xl font-extrabold text-amber-600">0</p>
                <p class="text-xs text-amber-700 mt-1">學習天數</p>
            </div>

            <div class="bg-purple-50 rounded-2xl p-4 text-center">
                <p id="record-round" class="text-3xl font-extrabold text-purple-600">0%</p>
                <p class="text-xs text-purple-700 mt-1">本輪進度</p>
            </div>
        </div>

        <div class="bg-slate-50 rounded-2xl p-4 text-sm text-gray-600">
            <div class="flex justify-between gap-3">
                <span>最近完成</span>
                <span id="record-last-date" class="font-bold text-gray-800">尚無紀錄</span>
            </div>
        </div>

        <button type="button"
                onclick="showWelcome()"
                class="w-full mt-5 bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-2xl">
            返回首頁
        </button>
    </div>

    <!-- 單字搜尋畫面 -->
    <div id="search-screen"
         class="hide bg-white rounded-3xl soft-shadow p-6 max-w-sm w-full h-[80vh] max-h-[650px] flex flex-col fade-in">

        <div class="flex items-center justify-between mb-4">
            <h2 class="text-2xl font-extrabold text-gray-800">
                搜尋單字
            </h2>

            <button type="button"
                    onclick="showWelcome()"
                    aria-label="返回首頁"
                    class="p-2 text-gray-400 hover:text-gray-700">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <div class="relative mb-4">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input id="search-input"
                   type="search"
                   inputmode="search"
                   autocomplete="off"
                   placeholder="輸入英文或中文"
                   oninput="searchWords()"
                   class="w-full border border-gray-200 rounded-2xl py-3 pl-11 pr-4 outline-none focus:ring-2 focus:ring-amber-200">
        </div>

        <p id="search-summary" class="text-xs text-gray-400 mb-3">
            可搜尋單字、中文意思與例句
        </p>

        <div id="search-results"
             class="flex-grow overflow-y-auto space-y-3 pr-1">
        </div>
    </div>

    <!-- 學習畫面 -->
    <div id="learning-screen"
         class="hide bg-white rounded-3xl soft-shadow p-6 max-w-sm w-full flex flex-col h-[80vh] max-h-[600px] fade-in relative">

        <div class="flex justify-between items-center mb-4 text-gray-400">
            <span id="progress-text"
                  class="font-bold text-sm bg-gray-100 px-3 py-1 rounded-full">
                1 / 5
            </span>

            <button type="button"
                    onclick="endLearning()"
                    aria-label="結束學習"
                    class="p-2 text-gray-400 hover:text-red-400 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <div class="w-full bg-gray-100 rounded-full h-1.5 mb-6">
            <div id="progress-bar"
                 class="bg-green-400 h-1.5 rounded-full transition-all duration-500"
                 style="width: 20%">
            </div>
        </div>

        <div class="flex-grow flex flex-col justify-center items-center text-center">
            <h2 id="word-title"
                class="text-5xl font-extrabold text-gray-800 mb-3 tracking-tight">
                word
            </h2>

            <div class="flex items-center gap-3 mb-6">
                <span id="word-pos"
                      class="bg-blue-50 text-blue-600 px-3 py-1 rounded-xl text-sm font-bold">
                    n.
                </span>

                <button type="button"
                        onclick="speakCurrentWord()"
                        class="text-blue-500 hover:text-blue-600 bg-blue-50 px-4 py-2 rounded-full flex items-center justify-center transition-colors active:scale-95 font-bold text-sm">
                    <i class="fas fa-volume-up mr-2"></i>
                    再聽一次
                </button>
            </div>

            <div class="w-full bg-slate-50 p-5 rounded-2xl border border-slate-100 mb-6">
                <p id="word-zh"
                   class="text-2xl text-gray-800 font-bold mb-3">
                    中文意思
                </p>

                <div class="text-left border-t border-gray-200 pt-3">
                    <p id="word-en-eg"
                       class="text-gray-600 text-md font-medium mb-1">
                        Example sentence.
                    </p>

                    <p id="word-zh-eg"
                       class="text-gray-400 text-sm">
                        例句中文翻譯
                    </p>
                </div>
            </div>

            <div class="w-full bg-green-50 rounded-xl p-3 border border-green-100 flex items-center justify-center gap-2">
                <i class="fas fa-bullhorn text-green-500"></i>
                <p class="text-sm text-green-700 font-bold">
                    換你大聲唸唸看！
                </p>
            </div>
        </div>

        <div class="flex gap-3 mt-4">
            <button type="button"
                    onclick="prevWord()"
                    id="prev-btn"
                    aria-label="上一個單字"
                    class="w-14 bg-gray-50 text-gray-400 font-bold py-4 rounded-2xl transition-colors active:bg-gray-100 disabled:opacity-30">
                <i class="fas fa-chevron-left"></i>
            </button>

            <button type="button"
                    onclick="nextWord()"
                    id="next-btn"
                    class="flex-grow bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-2xl shadow-lg transition-transform active:scale-95 text-lg">
                唸好了，下一個
                <i class="fas fa-arrow-right ml-1"></i>
            </button>
        </div>
    </div>

    <!-- 完成畫面 -->
    <div id="finish-screen"
         class="hide bg-white rounded-3xl soft-shadow p-8 max-w-sm w-full text-center fade-in">

        <div class="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-award text-4xl text-yellow-500"></i>
        </div>

        <h2 class="text-2xl font-extrabold text-gray-800 mb-2">
            今天完成了！
        </h2>

        <p class="text-gray-500 mb-8 text-sm leading-relaxed">
            今天的 5 個單字完成了。<br>
            每天聽一點、唸一點就很好。
        </p>

        <button type="button"
                onclick="restartLearning()"
                class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-2xl shadow-lg transition-transform active:scale-95 text-lg">
            <i class="fas fa-redo mr-2"></i>
            再練 5 個字
        </button>
    </div>

    <!-- 單字資料庫 -->
    <script src="words_8A.js"></script>

    <script>
        "use strict";

        const WORDS_PER_SESSION = 5;
        const STORAGE_KEY = "englishVocabApp_8A_seenWords";
        const RECORD_KEY = "englishVocabApp_8A_learningRecord";

        let dailyWords = [];
        let currentIndex = 0;
        let selectedVoice = null;
        let sentenceTimer = null;
        let speechSessionId = 0;
        let completedCurrentSession = false;

        const synth = window.speechSynthesis;

        function getLearningRecord() {
            const emptyRecord = {
                sessions: 0,
                completedWords: 0,
                studyDates: [],
                lastCompletedAt: null
            };

            try {
                const stored = localStorage.getItem(RECORD_KEY);
                const parsed = stored ? JSON.parse(stored) : null;

                if (!parsed || typeof parsed !== "object") {
                    return emptyRecord;
                }

                return {
                    sessions: Number(parsed.sessions) || 0,
                    completedWords: Number(parsed.completedWords) || 0,
                    studyDates: Array.isArray(parsed.studyDates) ? parsed.studyDates : [],
                    lastCompletedAt: parsed.lastCompletedAt || null
                };
            } catch (error) {
                console.warn("無法讀取學習紀錄：", error);
                return emptyRecord;
            }
        }

        function saveLearningRecord(record) {
            try {
                localStorage.setItem(RECORD_KEY, JSON.stringify(record));
            } catch (error) {
                console.warn("無法儲存學習紀錄：", error);
            }
        }

        function recordCompletedSession() {
            if (completedCurrentSession || dailyWords.length === 0) {
                return;
            }

            const record = getLearningRecord();
            const today = new Date().toLocaleDateString("en-CA");

            record.sessions += 1;
            record.completedWords += dailyWords.length;
            record.lastCompletedAt = new Date().toISOString();
            record.studyDates = [...new Set([...record.studyDates, today])];

            saveLearningRecord(record);
            completedCurrentSession = true;
        }

        function formatRecordDate(isoString) {
            if (!isoString) {
                return "尚無紀錄";
            }

            const date = new Date(isoString);

            if (Number.isNaN(date.getTime())) {
                return "尚無紀錄";
            }

            return new Intl.DateTimeFormat("zh-TW", {
                year: "numeric",
                month: "numeric",
                day: "numeric"
            }).format(date);
        }

        function hideAllScreens() {
            [
                "welcome-screen",
                "records-screen",
                "search-screen",
                "learning-screen",
                "finish-screen"
            ].forEach(id => {
                document.getElementById(id).classList.add("hide");
            });
        }

        function showWelcome() {
            stopSpeech();
            hideAllScreens();
            document.getElementById("welcome-screen").classList.remove("hide");
            updateRoundInfo();
        }

        function openRecords() {
            stopSpeech();
            hideAllScreens();

            const record = getLearningRecord();
            const total = Array.isArray(window.wordDatabase)
                ? window.wordDatabase.length
                : 0;
            const seen = getSeenWords().filter(word =>
                window.wordDatabase.some(item => item.word === word)
            ).length;
            const roundPercent = total > 0
                ? Math.round((seen / total) * 100)
                : 0;

            document.getElementById("record-sessions").textContent =
                record.sessions;
            document.getElementById("record-words").textContent =
                record.completedWords;
            document.getElementById("record-days").textContent =
                record.studyDates.length;
            document.getElementById("record-round").textContent =
                `${roundPercent}%`;
            document.getElementById("record-last-date").textContent =
                formatRecordDate(record.lastCompletedAt);

            document.getElementById("records-screen").classList.remove("hide");
        }

        function openSearch() {
            stopSpeech();
            hideAllScreens();
            document.getElementById("search-screen").classList.remove("hide");

            const input = document.getElementById("search-input");
            input.value = "";
            renderSearchResults([]);
            document.getElementById("search-summary").textContent =
                "可搜尋單字、中文意思與例句";

            window.setTimeout(() => input.focus(), 100);
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function searchWords() {
            const query = document
                .getElementById("search-input")
                .value
                .trim()
                .toLocaleLowerCase();

            if (!query) {
                renderSearchResults([]);
                document.getElementById("search-summary").textContent =
                    "可搜尋單字、中文意思與例句";
                return;
            }

            const results = window.wordDatabase.filter(item => {
                const searchableText = [
                    item.word,
                    item.pos,
                    item.zh,
                    item.en_eg,
                    item.zh_eg
                ].join(" ").toLocaleLowerCase();

                return searchableText.includes(query);
            });

            renderSearchResults(results);
            document.getElementById("search-summary").textContent =
                `找到 ${results.length} 筆結果`;
        }

        function renderSearchResults(results) {
            const container = document.getElementById("search-results");

            if (results.length === 0) {
                const hasQuery =
                    document.getElementById("search-input").value.trim() !== "";

                container.innerHTML = `
                    <div class="text-center text-gray-400 py-12">
                        <i class="fas ${hasQuery ? "fa-face-frown" : "fa-keyboard"} text-3xl mb-3"></i>
                        <p class="text-sm">
                            ${hasQuery ? "找不到符合的單字" : "輸入文字後開始搜尋"}
                        </p>
                    </div>
                `;
                return;
            }

            container.innerHTML = results.map((item, index) => `
                <article class="border border-gray-100 bg-slate-50 rounded-2xl p-4">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 class="text-xl font-extrabold text-gray-800">
                                    ${escapeHtml(item.word)}
                                </h3>
                                <span class="text-xs font-bold bg-blue-50 text-blue-600 px-2 py-1 rounded-lg">
                                    ${escapeHtml(item.pos)}
                                </span>
                            </div>
                            <p class="text-gray-700 font-bold mt-1">
                                ${escapeHtml(item.zh)}
                            </p>
                        </div>

                        <button type="button"
                                onclick="speakSearchResult(${index})"
                                aria-label="播放 ${escapeHtml(item.word)}"
                                class="shrink-0 w-10 h-10 rounded-full bg-blue-50 text-blue-600 active:scale-95">
                            <i class="fas fa-volume-up"></i>
                        </button>
                    </div>

                    <div class="border-t border-gray-200 mt-3 pt-3 text-left">
                        <p class="text-sm text-gray-600 font-medium">
                            ${escapeHtml(item.en_eg)}
                        </p>
                        <p class="text-xs text-gray-400 mt-1">
                            ${escapeHtml(item.zh_eg)}
                        </p>
                    </div>
                </article>
            `).join("");

            window.currentSearchResults = results;
        }

        function speakSearchResult(index) {
            const item = window.currentSearchResults?.[index];

            if (!item || !("speechSynthesis" in window)) {
                return;
            }

            stopSpeech();

            if (!selectedVoice) {
                loadVoices();
            }

            const utterance = new SpeechSynthesisUtterance(
                `${item.word}. ${item.en_eg}`
            );

            utterance.lang = "en-US";
            utterance.rate = 0.65;

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            synth.speak(utterance);
        }

        function shuffleArray(items) {
            const result = [...items];

            for (let i = result.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }

            return result;
        }

        function getSeenWords() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                const parsed = stored ? JSON.parse(stored) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.warn("無法讀取學習紀錄：", error);
                return [];
            }
        }

        function saveSeenWords(words) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
            } catch (error) {
                console.warn("無法儲存學習紀錄：", error);
            }
        }

        function getNextWords(database, count) {
            const allWords = database.map(item => item.word);
            let seenWords = getSeenWords().filter(word => allWords.includes(word));
            let unseenWords = database.filter(item => !seenWords.includes(item.word));

            if (unseenWords.length === 0) {
                seenWords = [];
                unseenWords = [...database];
                saveSeenWords([]);
            }

            const selected = shuffleArray(unseenWords).slice(0, count);
            const updatedSeenWords = [...new Set([
                ...seenWords,
                ...selected.map(item => item.word)
            ])];

            saveSeenWords(updatedSeenWords);
            return selected;
        }

        function updateRoundInfo() {
            if (!Array.isArray(window.wordDatabase)) {
                return;
            }

            const total = window.wordDatabase.length;
            const seen = getSeenWords().filter(word =>
                window.wordDatabase.some(item => item.word === word)
            ).length;

            const remaining = Math.max(total - seen, 0);
            const info = document.getElementById("round-info");

            if (remaining === 0 && total > 0) {
                info.textContent = "這一輪已完成，下次會重新開始。";
            } else {
                info.textContent = `本輪尚有 ${remaining} 個字未出現`;
            }
        }

        function loadVoices() {
            const voices = synth.getVoices();

            selectedVoice =
                voices.find(voice => voice.name === "Samantha") ||
                voices.find(voice =>
                    voice.lang === "en-US" &&
                    (
                        voice.name.includes("Natural") ||
                        voice.name.includes("Enhanced") ||
                        voice.name.includes("Premium")
                    )
                ) ||
                voices.find(voice =>
                    voice.name.includes("Google US English")
                ) ||
                voices.find(voice => voice.lang === "en-US") ||
                voices.find(voice => voice.lang.startsWith("en")) ||
                voices[0] ||
                null;
        }

        function stopSpeech() {
            speechSessionId += 1;

            if (sentenceTimer !== null) {
                clearTimeout(sentenceTimer);
                sentenceTimer = null;
            }

            synth.cancel();
        }

        function startLearning() {
            if (!Array.isArray(window.wordDatabase) ||
                window.wordDatabase.length === 0) {
                alert("單字庫沒有載入成功！");
                return;
            }

            stopSpeech();

            dailyWords = getNextWords(
                window.wordDatabase,
                Math.min(WORDS_PER_SESSION, window.wordDatabase.length)
            );

            currentIndex = 0;
            completedCurrentSession = false;

            document.getElementById("welcome-screen").classList.add("hide");
            document.getElementById("finish-screen").classList.add("hide");
            document.getElementById("learning-screen").classList.remove("hide");

            updateCard();
        }

        function updateCard() {
            const current = dailyWords[currentIndex];

            if (!current) {
                return;
            }

            document.getElementById("word-title").textContent = current.word;
            document.getElementById("word-pos").textContent = current.pos;
            document.getElementById("word-zh").textContent = current.zh;
            document.getElementById("word-en-eg").textContent = current.en_eg;
            document.getElementById("word-zh-eg").textContent = current.zh_eg;

            document.getElementById("progress-text").textContent =
                `${currentIndex + 1} / ${dailyWords.length}`;

            document.getElementById("progress-bar").style.width =
                `${((currentIndex + 1) / dailyWords.length) * 100}%`;

            document.getElementById("prev-btn").disabled =
                currentIndex === 0;

            const nextBtn = document.getElementById("next-btn");

            if (currentIndex === dailyWords.length - 1) {
                nextBtn.innerHTML =
                    '完成今日任務 <i class="fas fa-check-circle ml-1"></i>';

                nextBtn.classList.remove(
                    "bg-gray-800",
                    "hover:bg-gray-900"
                );

                nextBtn.classList.add(
                    "bg-green-500",
                    "hover:bg-green-600"
                );
            } else {
                nextBtn.innerHTML =
                    '唸好了，下一個 <i class="fas fa-arrow-right ml-1"></i>';

                nextBtn.classList.remove(
                    "bg-green-500",
                    "hover:bg-green-600"
                );

                nextBtn.classList.add(
                    "bg-gray-800",
                    "hover:bg-gray-900"
                );
            }

            speakCurrentWord();
        }

        function speakCurrentWord() {
            const current = dailyWords[currentIndex];

            if (!current || !("speechSynthesis" in window)) {
                return;
            }

            stopSpeech();

            const currentSpeechSession = speechSessionId;

            if (!selectedVoice) {
                loadVoices();
            }

            const utterWord = new SpeechSynthesisUtterance(current.word);
            utterWord.lang = "en-US";
            utterWord.rate = 0.7;

            if (selectedVoice) {
                utterWord.voice = selectedVoice;
            }

            utterWord.onend = () => {
                if (currentSpeechSession !== speechSessionId) {
                    return;
                }

                sentenceTimer = window.setTimeout(() => {
                    if (currentSpeechSession !== speechSessionId) {
                        return;
                    }

                    const utterSentence =
                        new SpeechSynthesisUtterance(current.en_eg);

                    utterSentence.lang = "en-US";
                    utterSentence.rate = 0.6;

                    if (selectedVoice) {
                        utterSentence.voice = selectedVoice;
                    }

                    synth.speak(utterSentence);
                    sentenceTimer = null;
                }, 700);
            };

            synth.speak(utterWord);
        }

        function nextWord() {
            stopSpeech();

            if (currentIndex < dailyWords.length - 1) {
                currentIndex += 1;
                updateCard();
                return;
            }

            recordCompletedSession();
            document.getElementById("learning-screen").classList.add("hide");
            document.getElementById("finish-screen").classList.remove("hide");

            updateRoundInfo();
        }

        function prevWord() {
            if (currentIndex <= 0) {
                return;
            }

            stopSpeech();
            currentIndex -= 1;
            updateCard();
        }

        function endLearning() {
            showWelcome();
        }

        function restartLearning() {
            showWelcome();
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                stopSpeech();
            }
        });

        window.addEventListener("beforeunload", stopSpeech);

        if ("speechSynthesis" in window) {
            loadVoices();
            speechSynthesis.addEventListener("voiceschanged", loadVoices);
        }

        updateRoundInfo();
    </script>
</body>
</html>
